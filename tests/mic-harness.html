<!doctype html>
<meta charset="utf-8" />
<title>Test micro</title>
<button id="go">Démarrer</button>
<pre id="log"></pre>
<script type="module">
  // Page de test : affiche les notes entendues par le micro (utilisée par tests/mic.cjs).
  import { mic } from '../js/pitch.js';
  import { noteName } from '../js/music.js';
  window.__notes = [];
  document.getElementById('go').onclick = async () => {
    await mic.subscribe((notes) => {
      window.__notes.push({ m: notes[0], notes, t: Math.round(performance.now()) });
      document.getElementById('log').textContent += notes.map((m) => noteName(m)).join('+') + ' ';
    });
  };
</script>
